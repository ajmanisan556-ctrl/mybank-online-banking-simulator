<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyBank | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-blue-900 text-center">
            MyBank
        </h1>

        <p class="text-gray-500 text-center mt-2 mb-8">
            Online Banking Simulator
        </p>

        <form class="space-y-5">
            <div>
                <label class="block mb-2">Email Address</label>
                <input type="email" required
                    placeholder="Enter your email"
                    class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label class="block mb-2">Password</label>
                <input type="password" required
                    placeholder="Enter your password"
                    class="w-full border rounded-lg p-3">
            </div>

            <button type="button"
                class="w-full bg-blue-900 text-white py-3 rounded-lg">
                Sign In
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Demo banking only - no real money.
        </p>
    </div>

</body>
</html>
