<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | MyBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-blue-900 text-center">MyBank</h1>
    <p class="text-center text-gray-500 mt-2 mb-8">
        Create your virtual banking account
    </p>

    {% for message in get_flashed_messages() %}
    <p class="bg-blue-50 text-blue-800 p-3 rounded mb-4">{{ message }}</p>
    {% endfor %}

    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input type="text" name="full_name" required maxlength="100"
            placeholder="Full Name" class="w-full border rounded-lg p-3">

        <input type="email" name="email" required maxlength="150"
            placeholder="Email Address" class="w-full border rounded-lg p-3">

        <input type="password" name="password" required minlength="8"
            placeholder="Password (minimum 8 characters)"
            class="w-full border rounded-lg p-3">

        <button type="submit"
            class="w-full bg-blue-900 text-white py-3 rounded-lg">
            Create Account
        </button>
    </form>

    <p class="text-center mt-6 text-sm">
        Already registered?
        <a href="{{ url_for('login') }}" class="text-blue-700 font-semibold">
            Sign In
        </a>
    </p>
    <p class="text-center text-xs text-gray-400 mt-6">
        Simulation only - no real money.
    </p>
</div>
</body>
</html>
