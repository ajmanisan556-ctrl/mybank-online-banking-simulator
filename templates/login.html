<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | MyBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-blue-900 text-center">MyBank</h1>
    <p class="text-center text-gray-500 mt-2 mb-8">
        Sign in to your account
    </p>

    {% for message in get_flashed_messages() %}
    <p class="bg-red-50 text-red-700 p-3 rounded mb-4">{{ message }}</p>
    {% endfor %}

    <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input type="email" name="email" required
            placeholder="Email Address"
            class="w-full border rounded-lg p-3">

        <input type="password" name="password" required
            placeholder="Password"
            class="w-full border rounded-lg p-3">

        <button type="submit"
            class="w-full bg-blue-900 text-white py-3 rounded-lg">
            Sign In
        </button>
    </form>

    <p class="text-center mt-6 text-sm">
        Don't have an account?
        <a href="{{ url_for('register') }}" class="text-blue-700 font-semibold">
            Register
        </a>
    </p>
</div>
</body>
</html>
