<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | MyBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
<div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-blue-900">MyBank</h1>

        <form method="POST" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="text-red-600 font-semibold">Logout</button>
        </form>
    </div>

    <h2 class="text-xl font-semibold mb-6">
        Welcome, {{ user.full_name }}!
    </h2>

    <div class="bg-blue-900 text-white rounded-2xl p-8 shadow-lg">
        <p class="text-blue-200">Available Virtual Balance</p>
        <h2 class="text-4xl font-bold mt-3">
            PHP {{ "{:,.2f}".format(user.account.balance) }}
        </h2>

        <p class="text-blue-200 mt-6">Account Number</p>
        <p class="font-mono text-lg">
            {{ user.account.account_number }}
        </p>
    </div>

    <p class="text-gray-500 mt-6 text-sm">
        Demo banking only. All balances are fictional.
    </p>
</div>
</body>
</html>
